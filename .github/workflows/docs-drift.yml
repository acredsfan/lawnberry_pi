name: Docs Drift Guard

on:
  pull_request:
    branches: [ main, "**" ]
  push:
    branches: [ main ]

jobs:
  drift-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-lawnberry]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run docs drift detection
        run: |
          bash scripts/check_docs_drift.sh
